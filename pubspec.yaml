name: event_management
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  firebase_database: ^11.1.6
  cached_network_image: ^3.4.1
  sqflite: ^2.0.0+4
  intl_utils: ^2.8.7
  http: ^1.2.2
  intl: ^0.19.0
  logging: ^1.3.0
  logger: ^2.5.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  firebase_messaging: ^15.1.6
  retry: ^3.1.2
  connectivity_plus: ^6.1.1
  qr_flutter: ^4.1.0
  file_picker: ^8.1.7
  excel: ^4.0.6
  qr_code_scanner: ^1.0.1
  url_launcher: ^6.3.1
  fl_chart: ^0.69.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  image_picker_web: ^4.0.0
  flutter_html: ^3.0.0-beta.2
  provider: ^6.1.2
  device_calendar: ^4.3.3

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 4.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/facebook_logo.png
    - assets/images/gmail_logo.png
    - assets/images/event-management.png
    - assets/images/apply.png
    - assets/json/client_secret.json

flutter_intl:
  enabled: true
  arb-dir: lib/l10n
  template-arb-file: intl_en.arb
  output-dir: lib/gen_l10n